# Keel self-contained deployment. Requires keel.env alongside (gitignored):
#   OPENROUTER_API_KEY=...   # the gateway spends this
#   ANTHROPIC_API_KEY=...    # what the CLI presents; the keyless gateway ignores it
#   ANTHROPIC_BASE_URL=...   # http://gateway:4000 -- lives in keel.env, NOT here
name: keel
services:
  webchat:
    image: keel:latest
    # compose can BUILD this image itself (docker compose up -d --build webchat) -- the
    # cross-platform stranger path; no bash, no sudo. The fleet's VM bootstrap still builds
    # via build-image.sh and tags keel:latest first, so compose finds the image and this
    # block is inert there: up without --build never rebuilds an image that exists.
    # compose can BUILD the image itself -- the cross-platform stranger path (no bash, no sudo):
    #     docker compose --env-file ../versions.lock up -d --build webchat
    # The --env-file feeds the pinned versions into the build args below; versions.lock stays the
    # single source. The fleet's VM bootstrap still builds via build-image.sh and tags keel:latest
    # first, so plain `compose up` there finds the image and never touches this block (the :-
    # defaults keep unset-variable warnings out of its logs).
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        BASE_IMAGE: ${UBUNTU_BASE_IMAGE:-}@${UBUNTU_BASE_DIGEST:-}
        NODE_VERSION: ${NODE_VERSION:-}
        NODE_SHA256_X64: ${NODE_SHA256_LINUX_X64:-}
        NODE_SHA256_ARM64: ${NODE_SHA256_LINUX_ARM64:-}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: keel-webchat
    env_file: [keel.env]
    environment:
      KEEL_BIND: 0.0.0.0        # container netns; host exposure is the ports: line
      KEEL_DIR: /app
      NODE_PATH: /app/webchat/node_modules   # scripts/ modules (model-routing.js) resolve js-yaml from webchat deps
      HOME: /home/keel          # claude CLI config dir
      CLAUDE_CONFIG_DIR: /home/keel/.claude   # relocate .claude.json INTO the persistent volume (kills the recreate-warning)
      ANTHROPIC_SMALL_FAST_MODEL: claude-haiku-4.5   # gateway alias name; unpinned, the CLI sends its dated default and 404s the WebSearch aux-model call
      ANTHROPIC_MODEL: deepseek-v4-pro   # routine-tier default (system/model-routing.yaml); pins the CLI's MAIN model the way SMALL_FAST pins the aux -- bare `claude -p` from tools otherwise sends a dated default the gateway 400s
      WEB_DIRECT_MODEL: claude-sonnet-4-6   # web-ON turns bypass the gateway -> api.anthropic.com for REAL server-side web_search (uses the real ANTHROPIC_API_KEY)
      WEB_DIRECT_MODELS: "claude-sonnet-4.6=claude-sonnet-4-6,claude-sonnet-4.5=claude-sonnet-4-6,claude-haiku-4.5=claude-haiku-4-5-20251001,claude-opus-4.8=claude-opus-4-8"   # picker->direct map: web-ON runs the SELECTED model's direct equivalent (all three proven on this key)
    ports:
      - "${KEEL_PUBLISH_ADDR:-127.0.0.1}:${KEEL_PUBLISH_PORT:-8443}:8443"
    volumes:                    # image = code; state = volumes (literal split)
      - keel-state:/app/state
      - keel-knowledge:/app/knowledge
      - keel-logs:/app/logs
      - keel-support:/app/support
      - keel-exports:/app/exports   # export artifacts (score proposals, reconcile/multisource xlsx, inbound staging) -- was an unowned overlay dir: root-created, app-unwritable, lost on recreate
      - keel-claude:/home/keel/.claude   # Claude Code session store -> multi-turn memory (persist across recreate)
      # LiteLLM config bind-mounted read-write so `model-routing.js set`
      # regenerates it in place (persists on the host; gateway reads it).
      - ./litellm:/app/infra/docker/litellm
    restart: unless-stopped
  gateway:
    # OPTIONAL: `docker compose --profile gateway up -d`
    # Official image, digest-pinned (see infra/versions.lock for the vetting
    # record). Never pip-installed. Choose a provider config via LITELLM_CONFIG.
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm@sha256:9ef6f45bc0104940571765e610c52a1d761b5ec85efcd193795281086ee61277
    container_name: keel-gateway
    env_file: [keel.env]
    command: ["--config", "/cfg/${LITELLM_CONFIG:-openrouter.generated.yaml}", "--port", "4000"]
    volumes:
      - ./litellm:/cfg:ro
    extra_hosts:
      # Linux: host.docker.internal is not provided by default. Needed for
      # the ollama config (host-run model server). Harmless otherwise.
      - "host.docker.internal:host-gateway"
    # no host port: reachable only from the compose network (webchat -> gateway)
    restart: unless-stopped

volumes:
  keel-state:
  keel-knowledge:
  keel-logs:
  keel-support:
  keel-exports:
  keel-claude:
