# Keel skill/pipeline registry -- VALUES only. The invocation MECHANISM (auth, spawn,
# timeout, error shape, preconditions, record-to-state) is fleet-core scripts/skills.js.
# handler: entries name functions that stay verbatim in webchat/server.js (bespoke
# query mapping / confirm gates / pre-spawn seeding).

# The core this config needs. 2 = declared request params. 3 = taking from the shared skill
# inventory. A vendored core that reads less REFUSES AT BOOT rather than ignoring what it does
# not understand -- ignoring `params` spawns tools with no arguments; ignoring `inventory:`
# mounts an agent silently missing every skill it takes.
contract: 3
# TAKEN FROM THE SHARED INVENTORY (fleet-core scripts/skills-inventory.yaml, hash-verified by
# verify-core). These nine were carried here AND in the other profile, byte-identical -- two
# copies of one definition is one definition that can drift. Naming them takes the shared
# definition unmodified; there is no override, and defining any of them below as well is
# refused at boot. contract: 3 is required to take: an older vendored core reads up to 2 and
# must REFUSE this file rather than accept it and mount without these nine.
inventory:
  - /run-audit-verify
  - /run-check-auth
  - /run-check-backup
  - /run-check-net
  - /run-check-pause
  - /run-check-pii
  - /run-check-secrets
  - /run-check-vuln
  - /run-scan-tree

skills:
  - route: /queue
    bin: node
    args: [scripts/queue.js]
    timeout: 15000
    category: Capture
  - route: /queue-clear
    bin: node
    args: [scripts/queue.js, archive, --all]
    timeout: 20000
    category: Capture
  - route: /run-apply-edits
    bin: python3
    args: [tools/apply_portfolio_edits.py, exports/inbound/pending-edit.xlsx, --commit]
    timeout: 60000
    requireFile: exports/inbound/pending-edit.xlsx
    missingMsg: no pending portfolio edit - upload an edited export first
    category: Portfolio
  - route: /run-apply-inference
    bin: python3
    args: [tools/apply_inference_decisions.py, exports/inbound/pending-inference.xlsx, --commit]
    timeout: 60000
    requireFile: exports/inbound/pending-inference.xlsx
    missingMsg: no pending inference decisions - upload an Unconfirmed sheet with Decision cells filled first
    category: Portfolio
  - route: /run-reconcile-semantic
    bin: python3
    args: [tools/reconcile_semantic.py]
    timeout: 260000
    category: Portfolio
  - route: /run-score-all
    bin: python3
    args: [tools/score_pass.py, --limit, 30]
    timeout: 120000
    category: Portfolio
  - route: /run-normalize-jira
    bin: python3
    args: [tools/normalize_jira.py]
    timeout: 30000
    category: Portfolio
  - route: /run-reconcile
    bin: python3
    args: [tools/reconcile.py]
    timeout: 30000
    category: Portfolio
  - route: /run-normalize
    bin: python3
    args: [tools/normalize_backlog.py]
    timeout: 30000
    category: Portfolio
  # These four were handler entries -- functions in webchat/server.js -- purely because
  # argv needed a value from the query string. That cost them the job lane (no job record,
  # no audit row) and ran them under execFileSync, blocking the event loop for the length
  # of the tool. fleet-core skills.js now takes declared, constrained parameters, so they
  # are data. Every param that reaches argv names an enum or a pattern; a spec that forgets
  # stops the server at boot rather than accepting anything at request time.
  - route: /run-merge
    bin: python3
    args: [tools/merge_accept.py]
    timeout: 30000
    params:
      - name: action
        required: true
        enum: [accept, reject, distinct]
        missingMsg: action must be accept|reject|distinct
      - name: keys
        split: true
        pattern: '^[A-Za-z0-9_.:-]{1,64}$'
        maxItems: 50
    category: Portfolio
  - route: /run-find
    bin: python3
    args: [tools/find.py]
    timeout: 30000
    params:
      - name: q
        required: true
        pattern: '^.{1,200}$'
        missingMsg: 'usage: /find <feature or idea>'
    category: Portfolio
  - route: /run-apply
    bin: python3
    args: [tools/apply.py]
    timeout: 60000
    params:
      - name: commit
        equals: '1'
        append: flag
        flag: --commit
    category: Portfolio
  # Destructive and confirm-gated. `confirm` contributes no argv -- it is the refusal
  # itself, and the warning below is what an unconfirmed call gets back.
  - route: /run-e2e
    bin: bash
    args: [run_e2e.sh, --yes]
    timeout: 900000
    params:
      - name: confirm
        required: true
        enum: ['1']
        append: none
        missingMsg: |-
          RUN-E2E -- full pipeline demo on SYNTHETIC Northwind example data.
          DESTRUCTIVE: regenerates the demo corpus, OVERWRITES keel.config.json
          (SOURCE_KEY_PREFIX=NWR), reseeds knowledge/import/raw/, and drafts 25 demo
          items into state/. Do NOT run on a deployment holding real data.
          Suggested use: run once on a FRESH deployment before loading real data.
          Step 9 calls the LLM: ~30-60s (cloud), seconds (local GPU), several
          minutes (local CPU). The chat will wait -- do not resend.

          To proceed, type: /run-e2e confirm
    category: Portfolio
  - route: /run-normalize-ado
    handler: normalizeAdo
    category: Portfolio
